name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests copy the real scripts from here into throwaway fixture repos.
      REAL_AGENTIC_REPO_ROOT: ${{ github.workspace }}/agentic-repo
      PYTHON_BIN: python3
      # app.js refuses to start without one; tests only need a placeholder.
      SESSION_SECRET: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: herrjosua/agentic-repo
          path: agentic-repo
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agentic-repo/requirements.txt
      - run: pip install -r ../agentic-repo/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: shellcheck scripts/deploy.sh scripts/tests/deploy.test.sh
      # Runs deploy.sh against a throwaway checkout and a fake Selector. On
      # Linux this also covers the /proc process matching macOS can't.
      - run: scripts/tests/deploy.test.sh
