name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests copy the real scripts from here into throwaway fixture repos.
      REAL_AGENTIC_REPO_ROOT: ${{ github.workspace }}/agentic-repo
      PYTHON_BIN: python3
      # app.js refuses to start without one; tests only need a placeholder.
      SESSION_SECRET: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: herrjosua/agentic-repo
          path: agentic-repo
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agentic-repo/requirements.txt
      - run: pip install -r ../agentic-repo/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: shellcheck scripts/deploy.sh scripts/tests/deploy.test.sh scripts/ssh-retry-classify.sh scripts/tests/ssh-retry-classify.test.sh
      # Runs deploy.sh against a throwaway checkout and a fake process
      # manager. On Linux this also covers the /proc process matching macOS can't.
      - run: scripts/tests/deploy.test.sh
      - run: scripts/tests/ssh-retry-classify.test.sh

  # Publishes Storybook to Chromatic for visual review. fetch-depth: 0 gives
  # Chromatic full git history, which it needs for baseline detection and is
  # a prerequisite if we later turn on TurboSnap/onlyChanged as usage
  # approaches the free tier's 5,000 snapshot/month limit. exitZeroOnChanges
  # keeps this job green on visual diffs — whether the separate Chromatic
  # "UI Tests" check should block merge is a process decision, not plumbing.
  chromatic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: chromaui/action@v18
        with:
          workingDir: frontend
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true

  # Both Playwright configs, one per matrix leg so a failure in one never
  # hides the other and their test-results/ and playwright-report/ can't
  # overwrite each other. Each config's webServer starts the frontend and a
  # backend on a throwaway repo (e2e/support/start-backend.js) and sets
  # NODE_ENV and DEMO_MODE itself.
  e2e:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: main
            script: test
          - suite: demo
            script: test:demo
    defaults:
      run:
        working-directory: e2e
    env:
      # The throwaway repo copies the real scripts from here.
      REAL_AGENTIC_REPO_ROOT: ${{ github.workspace }}/agentic-repo
      PYTHON_BIN: python3
      # app.js refuses to start without one; tests only need a placeholder.
      SESSION_SECRET: ci-placeholder-not-a-secret
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: herrjosua/agentic-repo
          path: agentic-repo
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agentic-repo/requirements.txt
      - run: pip install -r ../agentic-repo/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: backend
      - run: npm ci
      # After e2e's npm ci, so npx uses its pinned Playwright. Headless only,
      # and every spec runs in Chromium (no projects in either config).
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run ${{ matrix.script }} -- --forbid-only --reporter=list,html --trace=retain-on-failure
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.suite }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
