name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH; refusing to deploy."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the tag reached main
        run: |
          sha="${{ github.sha }}"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha (tag ${{ github.ref_name }}) is not on main's history. Branch protection only covers commits that reached main; refusing to deploy a tag that bypassed it."
            exit 1
          fi
          echo "$sha is on main; the 5 required CI checks already covered it via branch protection."

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH (retries connection refusals from the shared host)
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' failed the format check a second time; refusing."
            exit 1
          fi

          key_file=$(mktemp)
          known_hosts_file=$(mktemp)
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT

          printf '%s\n' "$SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$SSH_HOST_KEY" > "$known_hosts_file"

          delays=(10 30 60)
          attempt=0
          max_attempts=$(( ${#delays[@]} + 1 ))

          while :; do
            attempt=$((attempt + 1))
            echo "::group::SSH attempt $attempt/$max_attempts"

            set +e
            ssh_output=$(ssh -i "$key_file" \
              -o UserKnownHostsFile="$known_hosts_file" \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "deploy $TAG" 2>&1)
            deploy_rc=$?
            set -e
            echo "$ssh_output"
            echo "::endgroup::"

            # Retry ONLY a pre-auth transport failure (SSH exit 255) matching
            # one of the failure modes we've actually seen or could see on
            # this shared host: the connection-slot refusal (confirmed by
            # host support: server out of connection slots, not IP/account
            # based) - which OpenSSH words differently depending on verbosity:
            # "Connection closed by remote host" in verbose (-v) output, or
            # "Connection closed by <host> port <port>" in the plain output
            # this step actually produces (no -v) - the kex-exchange banner
            # refusal, or a plain TCP-level "Connection refused". All are
            # transport-layer failures before deploy.sh ever runs, so all
            # are safe to retry the same way. A real auth failure or host-key
            # mismatch is also exit 255 but won't match this text, so it
            # fails loud on attempt 1 rather than retrying something
            # un-retryable. Anything that reached deploy.sh (0-3) is NEVER
            # retried here: retrying a completed deploy attempt could stack
            # a second deploy on top of a live rollback.
            if [[ $deploy_rc -eq 255 ]] && grep -qE \
                'Connection closed by remote host|Connection closed by [^ ]+ port [0-9]+|kex_exchange_identification|Not allowed at this time|Connection refused' \
                <<<"$ssh_output"; then
              if (( attempt < max_attempts )); then
                delay=${delays[$((attempt - 1))]}
                echo "SSH connection refused before login (host out of connection slots, or a transient outage). Retrying in ${delay}s..."
                sleep "$delay"
                continue
              fi
              echo "::error::SSH connection still refused after $max_attempts attempts. Nothing was deployed; this is a transport failure, not a deploy.sh result."
              exit 1
            fi

            break
          done

          echo "deploy.sh exit code: $deploy_rc"
          case $deploy_rc in
            0) echo "::notice::Deployed $TAG." ;;
            1) echo "::error::Deploy of $TAG FAILED and was rolled back. The site is back on the previous release; someone should look into why the deploy failed."; exit 1 ;;
            2) echo "::error::Deploy of $TAG failed AND the rollback itself failed, or the app didn't come back. NEEDS A HUMAN NOW - see 'Manual rollback' in docs/deploy.md."; exit 1 ;;
            3) echo "::error::Deploy of $TAG was refused before anything changed (bad tag, dirty checkout, lock held, etc). Nothing changed on the server."; exit 1 ;;
            *) echo "::error::Unexpected exit code $deploy_rc from the SSH session (not a deploy.sh code and not a recognized connection failure)."; exit 1 ;;
          esac
